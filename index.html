  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow-x: hidden;
      background: #262626;
      color: #ffffff;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    h3 {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      margin-bottom: 2rem;
      color: #ffffff;
    }

    p {
      font-size: 1.6rem;
      font-weight: 500;
      line-height: 2;
      letter-spacing: 0.08em;
      margin-bottom: 1.5rem;
      color: rgba(255, 255, 255, 0.85);
    }

    a {
      color: #ffffff;
      text-decoration: underline;
      transition: opacity 0.3s ease;
    }

    a:hover {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      h3 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 480px) {
      h3 {
        font-size: 1.8rem;
      }

      p {
        font-size: 1.2rem;
      }
    }
