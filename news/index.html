<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>News-TachibanaOfficialWebsite</title>

  <link rel="shortcut icon" href="../img/favicon/favicon.ico" />
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="../img/favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="152x152" href="../img/favicon/favicon-152-precomposed.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../img/favicon/favicon-180-precomposed.png">
  <meta name="theme-color" content="#262626">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      min-height: 100vh;
      background: #262626;
      color: #ffffff;
      font-family: 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    /* ─── Header ─── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: transparent;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease;
    }

    header.scrolled {
      /* 常に透明 */
    }

    .logo-center {
      max-height: 36px;
      width: auto;
      display: block;
      object-fit: contain;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .logo-center:hover {
      transform: scale(1.1);
    }

    /* ─── Page Content ─── */
    .page-wrapper {
      padding: 80px 6% 120px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .page-section-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      opacity: 0.8;
      margin-bottom: 60px;
      text-transform: uppercase;
    }

    /* ─── News List ─── */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .news-item {
      display: flex;
      align-items: center;
      gap: 48px;
      padding: 28px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.6s ease forwards;
      animation-fill-mode: both;
    }

    .news-item:first-child {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .news-date-box {
      flex-shrink: 0;
      width: 220px;
      height: 56px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.7);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .news-item:hover .news-date-box {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .news-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 0.04em;
      color: #ffffff;
      transition: opacity 0.3s ease;
    }

    .news-item:hover .news-title {
      opacity: 0.75;
    }

    /* ─── Footer ─── */
    footer {
      background: #262626;
      padding: 16px 6%;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    footer p {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.35);
    }


    /* ─── Responsive ─── */
    @media (max-width: 768px) {
      header { height: 50px; }
      .logo-center { max-height: 30px; }
      .page-wrapper { padding: 70px 5% 80px; }
      .news-item { gap: 24px; }
      .news-date-box { width: 160px; height: 48px; font-size: 0.85rem; }
      .news-title { font-size: 1.6rem; }
    }

    @media (max-width: 480px) {
      .news-item { flex-direction: column; align-items: flex-start; gap: 12px; }
      .news-date-box { width: 180px; }
      .news-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>


  <header id="main-header">
    <img
      src="../img/Logo_Site.png"
      alt="TachibanaOfficialWebsite"
      class="logo-center"
      id="logo-top"
      draggable="false"
    >
  </header>

  <div class="page-wrapper">
    <h1 class="page-section-title">News</h1>
    <div class="news-list" id="news-list">
      <!-- Populated by JS -->
    </div>
  </div>

  <footer>
    <p>2026 TACHIBANA</p>
  </footer>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());

    fetch('./news.json')
      .then(function(res) { return res.json(); })
      .then(function(items) {
        const list = document.getElementById('news-list');
        items.forEach(function(item, i) {
          const el = document.createElement('div');
          el.className = 'news-item';
          el.style.animationDelay = (i * 0.07 + 0.1) + 's';
          el.innerHTML =
            '<div class="news-date-box">' + item.date + '</div>' +
            '<div class="news-title">' + item.title + '</div>';
          list.appendChild(el);
        });
      })
      .catch(function(e) { console.error('Failed to load news.json', e); });

    // Header scroll effect
    const header = document.getElementById('main-header');
    window.addEventListener('scroll', function() {
      header.classList.toggle('scrolled', window.scrollY > 50);
    });

    // ロゴタップでホームへ
    const logo = document.getElementById('logo-top');
    if (logo) {
      logo.addEventListener('click', function() {
        window.location.href = '../';
      });
      logo.addEventListener('touchend', function(e) {
        e.preventDefault();
        window.location.href = '../';
      });
    }
  </script>

</body>
</html>
